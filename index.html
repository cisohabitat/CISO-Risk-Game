<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d26" />
    <meta
      name="description"
      content="CISO: First Year — a single-player cyber risk strategy game. Inherit an organisation, discover what actually matters, and live with your judgement."
    />
    <title>CISO: First Year</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Manifest only: no service worker until update behaviour is tested on iOS (plan §32.12). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      .boot {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
        background: #1b1d26;
        color: #e8e6e3;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .boot-title { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
      .boot-note { margin: 0; font-size: 0.875rem; opacity: 0.7; }
      /*
        The document starts on the dark theme and the entry module switches it
        for a light-mode player, so the shell follows data-theme rather than
        prefers-color-scheme. It cannot be done before parse: the CSP allows no
        inline script, only inline style.
      */
      html[data-theme='light'] .boot { background: #f7f6f3; color: #24262e; }
    </style>
  </head>
  <body>
    <!--
      A static first paint. The app replaces this the moment React mounts; it
      exists so a slow connection sees the game arriving rather than a blank
      page (plan §48). Its styles are inlined in the head because the
      stylesheet is a separate request that may not have landed yet, and it
      follows the theme the entry module sets.
    -->
    <div id="root">
      <div class="boot">
        <p class="boot-title">CISO: First Year</p>
        <p class="boot-note">Loading the campaign…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
