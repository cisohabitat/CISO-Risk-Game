name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push supersedes an older run on a feature branch. On main every
# revision keeps its run: deployment needs the full suite green for the exact
# revision being deployed, and a cancelled run verifies nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck, lint, content and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit:security
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm validate:content
      - run: pnpm test
      - run: pnpm build
      - name: Check the build stayed within its size budget
        run: pnpm size
      - name: Check the build stayed static
        run: |
          # The MVP must deploy with no server runtime at all (plan §50).
          test -f dist/index.html
          ! test -d api
          ! test -d dist/api
          ! grep -rl "vercel/functions" dist >/dev/null 2>&1

  # One runner took about nineteen minutes for the whole suite. Four shards
  # split the tests (fullyParallel), each building and serving its own dist.
  e2e-shard:
    name: End-to-end shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # Keeps the single check name the suite has always reported under, so a
  # required status check does not need to know how many shards there are.
  e2e:
    name: End-to-end and responsive
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.e2e-shard.result }}" = success
