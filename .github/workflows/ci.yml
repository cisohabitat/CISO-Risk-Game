name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push supersedes an older run on a feature branch. On main every
# revision keeps its run: deployment needs the full suite green for the exact
# revision being deployed, and a cancelled run verifies nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Typecheck, lint, content and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit:security
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm validate:content
      - run: pnpm test
      - run: pnpm build
      - name: Check the build stayed within its size budget
        run: pnpm size
      - name: Check the build stayed static
        run: |
          # The MVP must deploy with no server runtime at all (plan §50).
          test -f dist/index.html
          ! test -d api
          ! test -d dist/api
          ! grep -rl "vercel/functions" dist >/dev/null 2>&1

  # One runner took about nineteen minutes for the whole suite. Four even
  # shards took 3.3 to 7.0 minutes, because Playwright cuts the suite in config
  # order and put desktop WebKit, the slowest project, in the first two. Split
  # by browser on 28 October, two WebKit runners took 2.9 and 2.0 minutes and
  # three Chromium runners about 4.8 each, so WebKit now has one runner and the
  # five Chromium projects share four. Each installs only its browser.
  # tests/content/deployment.test.ts fails if a project is left out.
  e2e-shard:
    name: End-to-end ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebKit
            browser: webkit
            args: --project=desktop-webkit --shard=1/1
          - name: Chromium 1/4
            browser: chromium
            args: --project=desktop-chromium --project=tablet-portrait --project=tablet-landscape --project=phone --project=phone-320 --shard=1/4
          - name: Chromium 2/4
            browser: chromium
            args: --project=desktop-chromium --project=tablet-portrait --project=tablet-landscape --project=phone --project=phone-320 --shard=2/4
          - name: Chromium 3/4
            browser: chromium
            args: --project=desktop-chromium --project=tablet-portrait --project=tablet-landscape --project=phone --project=phone-320 --shard=3/4
          - name: Chromium 4/4
            browser: chromium
            args: --project=desktop-chromium --project=tablet-portrait --project=tablet-landscape --project=phone --project=phone-320 --shard=4/4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e ${{ matrix.args }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7

  # Keeps the single check name the suite has always reported under, so a
  # required status check does not need to know how many shards there are.
  e2e:
    name: End-to-end and responsive
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.e2e-shard.result }}" = success
